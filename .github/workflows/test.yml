name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (fake docker)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install bats
      run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
    - name: Run unit tests
      run: bats test/unit

  smoke:
    # macOS runners have no Docker engine, so the end-to-end run is Linux only.
    name: Smoke (real Docker)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    # Host node for the NODE_SHIMS_LOCAL tests. Same major as the default
    # container image, so local and Docker runs use the same Node.
    - uses: actions/setup-node@v4
      with:
        node-version: '26'
    - name: Install bats
      run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
    - name: Run smoke tests
      run: bats --print-output-on-failure test/smoke
